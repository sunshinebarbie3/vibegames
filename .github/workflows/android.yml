name: Android and API verification
on:
  push:
    branches: ['arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Resources
        run: |
          python3 tools/check_strings.py || { python3 tools/check_strings.py 2>&1 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Compile XML, Room and Kotlin
        run: |
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace > android-build.log 2>&1 || { tail -220 android-build.log; exit 1; }
          tail -40 android-build.log
      - name: Surface compiler errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build.log')
          lines=p.read_text().splitlines() if p.exists() else ['Android build log missing']
          import re
          matched=[s for s in lines if re.search(r'(Could not|couldn.t|unresolved|failed|FAILURE|What went wrong|Execution failed|not found|timed out|UnknownHost|PKIX|401|403|404|500|Error:|Exception:|A problem occurred)',s,re.I)]
          for s in (matched or lines[:80]): print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibe-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/schemas/
            android-build.log
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm run check && npm test
        working-directory: server
