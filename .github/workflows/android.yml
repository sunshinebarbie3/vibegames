name: Android and API verification
on:
  push:
    branches: ['arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Resources
        run: |
          python3 tools/check_strings.py || { python3 tools/check_strings.py 2>&1 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Compile XML, Room and Kotlin
        run: |
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace > android-build.log 2>&1 || { tail -220 android-build.log; exit 1; }
          tail -40 android-build.log
      - name: Surface compiler errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build.log')
          lines=p.read_text().splitlines() if p.exists() else ['Android build log missing']
          import re
          matched=[s for s in lines if s.startswith(('e: ','w: ')) or re.search(r'(Could not|couldn.t|unresolved|failed|FAILURE|What went wrong|Execution failed|not found|timed out|UnknownHost|PKIX|401|403|404|500|error:|Error:|Exception|exception|Caused by|Kotlin compiler|internal error|A problem occurred|Type mismatch|Overload resolution|cannot find|not enough information|Expecting)',s,re.I)]
          compile_lines=[i for i,s in enumerate(lines) if 'compileDebugKotlin' in s or 'KotlinCompilerWorkAction' in s]
          if compile_lines:
              i=compile_lines[-1]
              section=lines[max(0,i-180):min(len(lines),i+60)]
              roots=[s.strip() for s in section if s.startswith(('e: ','w: ')) or re.search(r'(Caused by:|Compilation error|OutOfMemory|Exception|Error|error:|internal error|NoSuchMethod|Could not|unresolved reference|Type mismatch)',s,re.I)]
              if roots: print('::error::Kotlin compiler root cause: '+' | '.join(roots[:30]).replace('%','%25'))
              else:
                  for s in section[-30:]: print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          start=max((i for i,s in enumerate(lines) if s.strip()=='* What went wrong:'),default=-1)
          if start >= 0:
              for s in lines[start:start+90]: print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          details=[s.strip() for s in matched if s.startswith(('e: ','w: ')) or re.search(r'(Could not find|Could not get|Could not resolve|No cached version|PKIX|UnknownHost|status code|Received status|not found|timed out|unresolved reference|error:|Type mismatch|Overload resolution|Expecting)',s,re.I)]
          if details: print('::error::Dependency/compiler details: '+' | '.join(details[:18]).replace('%','%25'))
          if start < 0:
              for s in (matched or lines[:80])[:18]: print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibe-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/schemas/
            android-build.log
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm run check && npm test
        working-directory: server
